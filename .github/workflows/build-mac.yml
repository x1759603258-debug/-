name: Build Mac

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Build app
        run: npm run build

      - name: Build Mac zip
        run: npx electron-builder --mac zip --${{ matrix.arch }} --publish never --config.npmRebuild=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wanxun-mac-${{ matrix.arch }}
          path: |
            release/*.zip
            release/*.blockmap
          if-no-files-found: error
